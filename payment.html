<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>The Catfish Bar</h1>
    </header>
    <main>
        <h2>Delivery & Payment Details</h2>
        <div>
            <h3>Your Information</h3>
            <div>
            <input type="text" placeholder="Full Name" name="payment">
            </div>
            <div>
            <input type="text" placeholder="Phone Number" name="payment">
            </div>
            <div>
            <input type="text" placeholder="Email Address" name="payment">
            </div>
        </div>
        <div>
            <h3>Payment Details</h3>
            <div>
            <input type="text" placeholder="Name on Card" name="payment">
            </div>
            <div>
            <input type="text" placeholder="Card Number" name="payment">
            </div>
            <div>
            <input type="text" placeholder="Expiry Date(DD/MM/YY)" name="payment">
            </div>
            <div>
            <input type="text" placeholder="CVV" name="payment">
            </div>
        <div>
            <h3>Delivery Address (Optional)</h3>
            <div>
            <input type="text" placeholder="Address" name="payment">
            </div>
            <div>
            <input type="text" placeholder="State" name="payment">
            </div>
            <div>
            <input type="text" placeholder="Post Code" name="payment">
            </div>
        </div>
        <button type="button">Confirm</button>
    </main>
</body>
</html>
