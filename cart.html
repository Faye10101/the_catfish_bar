<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/layout/footer.css">
    <link rel="stylesheet" href="css/layout/header.css">
    <link rel="stylesheet" href="css/layout/main.css">
    <link rel="stylesheet" href="css/layout/responsive.css">
    <link rel="stylesheet" href="css/pages/cart.css">
    <link rel="stylesheet" href="css/system/color.css">
    <link rel="stylesheet" href="css/system/reset.css">
    <link rel="stylesheet" href="css/system/typography.css">
    <title>Shopping Cart</title>
</head>

<body>

    <header>
            <h1>The Catfish Bar</h1>
    </header>

    <main>
        <section class="receipt">
            <h2 class="receipt-title">Your Order</h2>
            <div id="cart-items" class="cart-items"></div>
            <div class="cart-row cart-total-row">
                <span class="cart-item-name"><strong>TOTAL</strong></span>
                <span class="cart-item-quantity" id="cart-total-quantity">0</span>
                <span class="cart-item-price" id="cart-total-price">$0</span>
            </div>
        </section>

        <div class="cart-actions">
            <a href="search.html" class="cart-button buy-more-button">Buy More</a>
            <a href="payment.html" class="cart-button pay-now-button">Pay Now</a>
        </div>
    </main>

    <footer>
        <p>
            <strong>Get in Touch</strong>
            Phone: (03) 9417 6420
            Email: info@thecatfish.com.au
        </p>
        <p>
            <strong>Find Us</strong>
            30 Gertrude Street Fitzroy
        </p>
    </footer>

    <script src="script.js"></script>
    
</body>
</html>
