<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/layout/footer.css">
    <link rel="stylesheet" href="css/layout/header.css">
    <link rel="stylesheet" href="css/layout/main.css">
    <link rel="stylesheet" href="css/layout/responsive.css">
    <link rel="stylesheet" href="css/pages/cart.css">
    <link rel="stylesheet" href="css/system/color.css">
    <link rel="stylesheet" href="css/system/reset.css">
    <link rel="stylesheet" href="css/system/typography.css">
    <title>Cart · The Catfish Bar</title>
</head>

<body>

    <header>
        <h1>The Catfish Bar</h1>
    </header>

    <nav class="global-nav">
        <a href="index.html" class="global-nav-link">Home</a>
        <a href="search.html" class="global-nav-link">Shop</a>
        <a href="cart.html" class="global-nav-link active-nav">Cart</a>
    </nav>

    <main>
        <section class="receipt">
            <h2 class="receipt-title">Your Order</h2>
            <div id="cart-items" class="cart-items"></div>
            <div class="cart-row cart-total-row">
                <span class="cart-item-name"><strong>TOTAL</strong></span>
                <span class="cart-item-quantity" id="cart-total-quantity">0</span>
                <span class="cart-item-price" id="cart-total-price">$0</span>
            </div>
        </section>

        <div class="cart-actions">
            <a href="search.html" class="cart-button buy-more-button">Buy More</a>
            <a href="payment.html" class="cart-button pay-now-button">Pay Now</a>
        </div>
    </main>

    <div class="section-divider"><span>✦ ✦ ✦</span></div>

    <footer>
        <div class="footer-inner">
            <div class="footer-col">
                <p class="footer-heading">Get in Touch</p>
                <p>Phone: (03) 9417 6420</p>
                <p>Email: info@thecatfish.com.au</p>
            </div>
            <div class="footer-col">
                <p class="footer-heading">Find Us</p>
                <p>30 Gertrude Street</p>
                <p>Fitzroy, VIC 3065</p>
            </div>
            <div class="footer-col">
                <p class="footer-heading">Explore</p>
                <p><a href="index.html" class="footer-link">Home</a></p>
                <p><a href="search.html" class="footer-link">Shop</a></p>
                <p><a href="cart.html" class="footer-link">Cart</a></p>
            </div>
        </div>
        <p class="footer-copy">© 2026 The Catfish Bar · 30 Gertrude St Fitzroy · All rights reserved</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
