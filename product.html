<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/layout/footer.css">
    <link rel="stylesheet" href="css/layout/header.css">
    <link rel="stylesheet" href="css/layout/main.css">
    <link rel="stylesheet" href="css/layout/responsive.css">
    <link rel="stylesheet" href="css/pages/product.css">
    <link rel="stylesheet" href="css/system/color.css">
    <link rel="stylesheet" href="css/system/reset.css">
    <link rel="stylesheet" href="css/system/typography.css">
    <title>Product</title>
</head>

<body>

    <header class="page-header">
        <a href="result.html" class="back-link" aria-label="Back to results">←</a>
        <h1>The Catfish Bar</h1>
    </header>

    <section class="product-hero">
        <img src="assets/liquor-shelf.png" alt="A shelf of bottles at the bar">
    </section>

    <main id="product-page">
        <div class="product-banner">
            <h2 id="product-name" class="ribbon-title"></h2>
        </div>
        <p id="product-style" class="product-style-line"></p>

        <section class="product-purchase">
            <img id="product-image" src="" alt="">
            <div id="purchase-panel"></div>
        </section>
        <p id="product-description" class="product-description"></p>

        <button type="button" class="accordion-toggle">
            More Information <span class="accordion-icon">&#9662;</span>
        </button>
        <div class="accordion-content">
            <p id="more-information"></p>
        </div>

        <button type="button" class="accordion-toggle">
            Product Reviews <span class="accordion-icon">&#9662;</span>
        </button>
        <div class="accordion-content">
            <p id="product-reviews"></p>
        </div>

        <button type="button" class="accordion-toggle">
            You May Also Like <span class="accordion-icon">&#9662;</span>
        </button>
        <div class="accordion-content">
            <div id="you-may-also-like" class="related-products"></div>
        </div>
    </main>

    <footer>
        <p>
            <strong>Get in Touch</strong>
            Phone: (03) 9417 6420
            Email: info@thecatfish.com.au
        </p>
        <p>
            <strong>Find Us</strong>
            30 Gertrude Street Fitzroy
        </p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
