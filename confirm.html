<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/system/reset.css">
    <link rel="stylesheet" href="css/system/color.css">
    <link rel="stylesheet" href="css/system/typography.css">
    <link rel="stylesheet" href="css/layout/footer.css">
    <link rel="stylesheet" href="css/pages/confirm.css"> <title>Order Confirmed</title>
</head>
<body>

    <main class="confirm-main">
        <div class="confirm-box">
            <div class="success-icon">✓</div>
            <h2>Cheers! Order Confirmed</h2>
            <p class="sub-text">We are pouring your drinks. See you at Gertrude Street soon!</p>
            
            <div class="order-summary-card">
                <h4>Your Pick-up Order:</h4>
                <p>🍺 Item: <span id="summary-name">Molly Rose Beer</span></p>
                <p>🔢 Qty: <span id="summary-qty">1</span></p>
                <p>📍 Location: 30 Gertrude Street, Fitzroy</p>
            </div>
            
            <a href="index.html" class="back-home-btn">Back to Homepage</a>
        </div>
    </main>

    <script>
        document.getElementById('summary-name').innerText = localStorage.getItem('cart_item') || "Molly Rose Beer";
        document.getElementById('summary-qty').innerText = localStorage.getItem('cart_qty') || "1";
    </script>
</body>
</html>
