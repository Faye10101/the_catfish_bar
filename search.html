<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/components/buttons.css">
    <link rel="stylesheet" href="css/components/cards.css">
    <link rel="stylesheet" href="css/components/dropdown.css">
    <link rel="stylesheet" href="css/components/forms.css">
    <link rel="stylesheet" href="css/layout/footer.css">
    <link rel="stylesheet" href="css/layout/header.css">
    <link rel="stylesheet" href="css/layout/main.css">
    <link rel="stylesheet" href="css/layout/navigation.css">
    <link rel="stylesheet" href="css/layout/responsive.css">
    <link rel="stylesheet" href="css/pages/search.css">
    <link rel="stylesheet" href="css/system/color.css">
    <link rel="stylesheet" href="css/system/reset.css">
    <link rel="stylesheet" href="css/system/typography.css">
    <title>Shop · The Catfish Bar</title>
</head>

<body>
    <header>
        <h1>The Catfish Bar</h1>
    </header>

    <nav class="global-nav">
        <a href="index.html" class="global-nav-link">Home</a>
        <a href="search.html" class="global-nav-link active-nav">Shop</a>
        <a href="cart.html" class="global-nav-link">Cart</a>
    </nav>

    <div class="search-bar">
        <span class="search-icon">⌕</span>
        <input type="text" id="search-input" placeholder="Search..">
        <button id="filter-icon">⛭</button>
    </div>

    <div id="filter-menu" class="hide">
        <button class="tag-button" data-tag="craft">Craft</button>
        <button class="tag-button" data-tag="sour">Sour & Fruit</button>
        <button class="tag-button" data-tag="dark">Dark & Spirits</button>
    </div>

    <nav class="nav-bar">
        <button class="tag-button" data-tag="drink">Drink</button>
        <button class="tag-button" data-tag="food">Food</button>
        <button class="tag-button" data-tag="event">Event</button>
    </nav>

    <main>
        <div class="shop-group">
            <h3>Best Seller</h3>
            <div class="slide" id="group-best-seller"></div>
        </div>

        <div class="shop-group">
            <h3>Latest Arrived</h3>
            <div class="slide" id="group-latest-arrived"></div>
        </div>

        <div class="shop-group">
            <h3>Seasonal</h3>
            <div class="slide" id="group-seasonal"></div>
        </div>
    </main>

    <div class="section-divider"><span>✦ ✦ ✦</span></div>

    <footer>
        <div class="footer-inner">
            <div class="footer-col">
                <p class="footer-heading">Get in Touch</p>
                <p>Phone: (03) 9417 6420</p>
                <p>Email: info@thecatfish.com.au</p>
            </div>
            <div class="footer-col">
                <p class="footer-heading">Find Us</p>
                <p>30 Gertrude Street</p>
                <p>Fitzroy, VIC 3065</p>
            </div>
            <div class="footer-col">
                <p class="footer-heading">Explore</p>
                <p><a href="index.html" class="footer-link">Home</a></p>
                <p><a href="search.html" class="footer-link">Shop</a></p>
                <p><a href="cart.html" class="footer-link">Cart</a></p>
            </div>
        </div>
        <p class="footer-copy">© 2026 The Catfish Bar · 30 Gertrude St Fitzroy · All rights reserved</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
